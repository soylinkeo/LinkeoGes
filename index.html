    <script>
      /* Polyfill inmediato de crypto.randomUUID para contextos no seguros (HTTP LAN / iPhone Safari) */
      (function() {
        if (typeof window !== 'undefined' && typeof window.crypto !== 'undefined') {
          if (typeof window.crypto.randomUUID !== 'function' && typeof window.crypto.getRandomValues === 'function') {
            window.crypto.randomUUID = function() {
              var bytes = new Uint8Array(16);
              window.crypto.getRandomValues(bytes);
              bytes[6] = (bytes[6] & 0x0f) | 0x40; // RFC 4122 v4
              bytes[8] = (bytes[8] & 0x3f) | 0x80; // RFC 4122 Variant 1
              var hex = Array.from(bytes, function(b) { return b.toString(16).padStart(2, '0'); }).join('');
              return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) + '-' + hex.slice(16, 20) + '-' + hex.slice(20);
            };
          }
        }
      })();
    </script>
